<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <title>TotemChat</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#f0f2f5; color:#1c1c1c; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
    .header { background:#ffffff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; border-bottom:1px solid #e0e0e0; }
    .header h1 { font-size:18px; font-weight:600; color:#1c1c1c; }
    .header .status { font-size:13px; color:#6c7a89; }
    .top-nav { display:flex; background:#ffffff; border-bottom:1px solid #e0e0e0; flex-shrink:0; }
    .top-nav button { flex:1; padding:12px 0; background:transparent; border:none; color:#6c7a89; font-size:14px; font-weight:500; transition:0.2s; cursor:pointer; }
    .top-nav button.active { color:#0088cc; border-bottom:2px solid #0088cc; }
    .top-nav button:active { background:#e6e6e6; }
    .main-area { flex:1; display:flex; flex-direction:column; overflow:hidden; background:#f0f2f5; }
    #messages { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:4px; }
    .msg { max-width:80%; padding:8px 12px; border-radius:12px; margin:2px 0; word-break:break-word; font-size:14px; line-height:1.4; animation:fadeIn 0.2s ease; }
    .msg.system { background:#e8e8e8; color:#6c7a89; align-self:center; font-size:12px; padding:4px 12px; border-radius:20px; margin:8px 0; max-width:90%; }
    .msg.me { background:#0088cc; color:#ffffff; align-self:flex-end; border-bottom-right-radius:4px; }
    .msg.other { background:#ffffff; color:#1c1c1c; align-self:flex-start; border-bottom-left-radius:4px; }
    .msg.voice { background:#d4e3f0; color:#1c1c1c; align-self:flex-start; border-bottom-left-radius:4px; cursor:pointer; }
    .msg.voice.me { background:#b3d4e8; align-self:flex-end; border-bottom-right-radius:4px; }
    .input-area { display:flex; gap:8px; padding:10px 16px; background:#ffffff; border-top:1px solid #e0e0e0; flex-shrink:0; align-items:center; }
    .input-area input { flex:1; padding:10px 14px; border-radius:20px; border:1px solid #d0d0d0; background:#f5f5f5; color:#1c1c1c; font-size:15px; outline:none; }
    .input-area input::placeholder { color:#9a9a9a; }
    .input-area button { padding:10px 18px; border-radius:20px; border:none; background:#0088cc; color:#ffffff; font-weight:bold; font-size:15px; cursor:pointer; transition:0.2s; }
    .input-area button:active { background:#006699; }
    .input-area .record-btn { background:#e74c3c; border-radius:50%; width:44px; height:44px; display:flex; align-items:center; justify-content:center; font-size:18px; padding:0; flex-shrink:0; }
    .input-area .record-btn.recording { background:#c0392b; animation:pulse 0.8s infinite; }
    @keyframes pulse { 0% { transform:scale(1); } 50% { transform:scale(1.1); } 100% { transform:scale(1); } }
    .tab-content { display:none; flex:1; flex-direction:column; padding:12px 16px; overflow-y:auto; }
    .tab-content.active { display:flex; }
    .contact-item { padding:10px 0; border-bottom:1px solid #e0e0e0; display:flex; justify-content:space-between; align-items:center; }
    .contact-item span { color:#1c1c1c; }
    .contact-item button { background:#e8e8e8; border:none; color:#6c7a89; padding:4px 12px; border-radius:12px; font-size:12px; cursor:pointer; }
    .add-area { display:flex; gap:8px; margin-top:12px; }
    .add-area input { flex:1; padding:10px 14px; border-radius:20px; border:1px solid #d0d0d0; background:#ffffff; color:#1c1c1c; font-size:14px; outline:none; }
    .add-area button { padding:10px 16px; border-radius:20px; border:none; background:#0088cc; color:#ffffff; font-weight:bold; cursor:pointer; }
    .profile-container { text-align:center; padding:20px 0; }
    .profile-container p { color:#6c7a89; font-size:14px; }
    #peer-id { background:#ffffff; padding:12px; border-radius:12px; word-break:break-all; font-size:14px; margin-top:8px; border:1px solid #e0e0e0; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>

<div class="header">
  <h1>💬 TotemChat</h1>
  <span class="status" id="status">Подключение...</span>
</div>

<div class="top-nav">
  <button id="btn-chat" class="active" onclick="showTab('chat')">Чат</button>
  <button id="btn-contacts" onclick="showTab('contacts')">Контакты</button>
  <button id="btn-profile" onclick="showTab('profile')">Профиль</button>
</div>

<div class="main-area">
  <div id="tab-chat" class="tab-content active" style="display:flex;">
    <div id="messages"></div>
    <div class="input-area">
      <input id="input" placeholder="Сообщение..." />
      <button onclick="sendText()">➤</button>
      <button id="recordBtn" class="record-btn" onclick="toggleRecording()">🎤</button>
    </div>
  </div>

  <div id="tab-contacts" class="tab-content">
    <div id="contact-list"></div>
    <div class="add-area">
      <input id="contact-input" placeholder="PeerID друга" />
      <button onclick="addContact()">➕</button>
    </div>
  </div>

  <div id="tab-profile" class="tab-content">
    <div class="profile-container">
      <p><strong>PeerID</strong></p>
      <div id="peer-id">загрузка...</div>
    </div>
  </div>
</div>

<script>
  // ======= НАСТРОЙКИ =======
  const SERVER_URL = 'https://totem-chat-79-vbe79tsxyx71.sasha40932.deno.net';
  const MY_ID = 'user_' + Math.random().toString(36).substring(2,8);

  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('input');
  const statusEl = document.getElementById('status');
  const peerIdEl = document.getElementById('peer-id');
  const recordBtn = document.getElementById('recordBtn');

  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;

  // Звук при отправке
  function playSendSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 800;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.1);
    } catch(e) { /* тихо */ }
  }

  // ======= ЗАПИСЬ ГОЛОСА =======
  window.toggleRecording = async function() {
    if (isRecording) {
      stopRecording();
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/ogg' });
        const reader = new FileReader();
        reader.onload = () => {
          const base64 = reader.result.split(',')[1];
          sendVoice(base64);
        };
        reader.readAsDataURL(audioBlob);
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      isRecording = true;
      recordBtn.classList.add('recording');
      recordBtn.textContent = '⏹';
      statusEl.textContent = '🔴 Запись...';
    } catch(e) {
      alert('Нет доступа к микрофону');
    }
  };

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;
      recordBtn.classList.remove('recording');
      recordBtn.textContent = '🎤';
      statusEl.textContent = '⏳ Обработка...';
    }
  }

  // ======= ОТПРАВКА ГОЛОСА =======
  async function sendVoice(base64) {
    try {
      await fetch(SERVER_URL + '/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to: 'all', from: MY_ID, text: '[голос]', voice: base64 })
      });
      playSendSound();
      addMessage('🎤 Голосовое сообщение', 'me');
      statusEl.textContent = '✅ Голос отправлен';
    } catch(e) {
      statusEl.textContent = '❌ Ошибка';
    }
  }

  // ======= ОТПРАВКА ТЕКСТА =======
  window.sendText = async function() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    playSendSound();
    try {
      await fetch(SERVER_URL + '/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to: 'all', from: MY_ID, text })
      });
      addMessage(text, 'me');
      statusEl.textContent = '✅ Отправлено';
    } catch(e) {
      statusEl.textContent = '❌ Ошибка';
    }
  };

  // ======= ПОЛУЧЕНИЕ =======
  async function receive() {
    try {
      const res = await fetch(SERVER_URL + '/receive?peerId=' + MY_ID);
      if (!res.ok) throw new Error('Сервер не отвечает');
      const msgs = await res.json();
      if (msgs.length) statusEl.textContent = '📩 ' + msgs.length + ' новых';
      msgs.forEach(msg => {
        if (msg.voice) {
          addVoiceMessage(msg.voice, 'other');
        } else {
          addMessage(msg.text, 'other');
        }
      });
    } catch(e) {
      statusEl.textContent = '⚠️ Ошибка соединения';
    }
  }

  // ======= ВЫВОД ТЕКСТА =======
  function addMessage(text, type) {
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ======= ВЫВОД ГОЛОСА =======
  function addVoiceMessage(base64, type) {
    const div = document.createElement('div');
    div.className = 'msg voice ' + (type === 'me' ? 'me' : '');
    const audio = document.createElement('audio');
    audio.controls = true;
    audio.src = 'data:audio/ogg;base64,' + base64;
    audio.style.width = '180px';
    audio.style.height = '40px';
    div.appendChild(audio);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    // Звук уведомления при получении
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 1200;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.05, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.08);
    } catch(e) {}
  }

  // ======= КОНТАКТЫ =======
  function getContacts() {
    return JSON.parse(localStorage.getItem('contacts')) || [];
  }
  function setContacts(c) {
    localStorage.setItem('contacts', JSON.stringify(c));
  }
  function renderContacts() {
    const list = document.getElementById('contact-list');
    const contacts = getContacts();
    list.innerHTML = contacts.map((c,i) => `
      <div class="contact-item">
        <span>${c.name || c.peerId}</span>
        <button onclick="removeContact(${i})">Удалить</button>
      </div>
    `).join('');
  }
  window.addContact = function() {
    const input = document.getElementById('contact-input');
    const val = input.value.trim();
    if (!val) return;
    const contacts = getContacts();
    if (!contacts.find(c => c.peerId === val)) {
      contacts.push({ peerId: val, name: val.substring(0,6)+'…' });
      setContacts(contacts);
      renderContacts();
    }
    input.value = '';
  };
  window.removeContact = function(i) {
    const c = getContacts();
    c.splice(i,1);
    setContacts(c);
    renderContacts();
  };

  // ======= ВКЛАДКИ =======
  window.showTab = function(tab) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-'+tab).classList.add('active');
    document.querySelectorAll('.top-nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-'+tab).classList.add('active');
    if (tab === 'contacts') renderContacts();
  };

  // ======= ОПРОС =======
  setInterval(receive, 3000);
  receive();

  // ======= ENTER =======
  input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendText(); });

  // ======= СТАРТ =======
  peerIdEl.textContent = MY_ID;
  addMessage('Добро пожаловать в TotemChat', 'system');
  addMessage('Твой PeerID: ' + MY_ID, 'system');
  statusEl.textContent = '🔄 Подключено';
</script>
</body>
</html>
